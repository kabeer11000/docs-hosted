<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font: 'Playfair Display', Georgia, serif;
  --size: clamp(1.05rem, 1.6vw, 1.25rem);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font);
  font-size: var(--size);
  line-height: 2;
  cursor: default;
  user-select: none;
  transition: background-color 2.5s ease, color 2.5s ease;
}

/* --- Thematic Schemes --- */
.sch-dark { background: #000; color: #fff; --fg: #ffffff; --dim: rgba(255, 255, 255, 0.5); --mut: rgba(255, 255, 255, 0.22); --red: #880015; --bar: rgba(255, 255, 255, 0.15); --ctr: rgba(255, 255, 255, 0.25); --gol: #ffffff; }
.sch-inv { background: #f5f5f0; color: #111; --fg: #111111; --dim: rgba(0, 0, 0, 0.5); --mut: rgba(0, 0, 0, 0.25); --red: #8b0010; --bar: rgba(0, 0, 0, 0.15); --ctr: rgba(0, 0, 0, 0.3); --gol: rgba(0, 0, 0, 0.18); }
.sch-red { background: #0a0000; color: #f0e0e0; --fg: #f0e0e0; --dim: rgba(220, 160, 160, 0.45); --mut: rgba(200, 140, 140, 0.2); --red: #cc2211; --bar: rgba(200, 140, 140, 0.15); --ctr: rgba(200, 140, 140, 0.25); --gol: #f0e0e0; }

/* --- Background Canvases --- */
#gol { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.12; transition: opacity 2s ease; }
#grain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 200; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay; }

/* --- The Void (Black Hole) --- */
#bh {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1);
  width: 800px; height: 800px; border-radius: 50%;
  z-index: 2; pointer-events: none;
  background: radial-gradient(circle, var(--bg-center, #000) 0%, var(--bg-mid, rgba(0,0,0,0.98)) 25%, var(--bg-edge, rgba(0,0,0,0.8)) 45%, transparent 75%);
  box-shadow: 0 0 160px 80px var(--bg-glow1, rgba(0,0,0,0.88)), 0 0 450px 160px var(--bg-glow2, rgba(0,0,0,0.4));
  filter: blur(25px); /* Creates the ethereal, gaseous falloff */
  animation: bh-pulse 44s ease-in-out infinite;
  transition: width 4s ease, height 4s ease, box-shadow 4s ease, opacity 3s ease, background 2s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), filter 2s ease;
}

.sch-inv #bh { --bg-center: #f5f5f0; --bg-mid: rgba(245,245,240,0.98); --bg-edge: rgba(245,245,240,0.8); --bg-glow1: rgba(245,245,240,0.9); --bg-glow2: rgba(245,245,240,0.5); }

@keyframes bh-pulse { 0%, 100% { opacity: 0.62; } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }

#bh.sz-1 { width: 1050px; height: 1050px; box-shadow: 0 0 250px 120px var(--bg-glow1), 0 0 650px 250px var(--bg-glow2); filter: blur(35px); animation-duration: 32s; }
#bh.sz-2 { width: 1350px; height: 1350px; box-shadow: 0 0 350px 160px var(--bg-glow1), 0 0 850px 350px var(--bg-glow2); filter: blur(50px); animation-duration: 20s; }
#bh.dead { opacity: 0; }

/* --- UI Elements & Transitions --- */
#curtain { position: absolute; inset: 0; z-index: 500; pointer-events: none; background: inherit; opacity: 0; transition: opacity 2s ease; }
#curtain.up { opacity: 1; }

#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 120;
  display: flex; align-items: center; justify-content: space-between;
  padding: 3vh 4vw; transition: opacity 0.8s ease;
}

.top-btn { font-family: inherit; font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mut); cursor: pointer; opacity: 0.5; transition: opacity 0.3s, color 0.3s; background: none; border: 0; outline: none; }
.top-btn:hover { opacity: 1; color: var(--fg); }
#vol-tag { font-size: 0.6rem; letter-spacing: 0.25em; opacity: 0.4; text-transform: uppercase; color: var(--mut); transition: color 0.3s; }

/* --- In-Menu State Triggers --- */
body.in-menu #bh {
  transform: translate(-50%, -50%) scale(0.01);
  opacity: 0;
  transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
  animation: none;
}
body.in-menu #stage, body.in-menu #prompt, body.in-menu #counter, body.in-menu #topbar {
  opacity: 0 !important;
  pointer-events: none;
  transition: opacity 0.8s ease;
}

/* --- 3D Floating Orb Menu --- */
#orb-menu {
  position: fixed; inset: 0; z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease 0.3s; /* Delay fade in slightly after collapse */
  background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
}
#orb-menu.active { opacity: 1; pointer-events: all; }

.orb-menu-nav { position: absolute; top: 3vh; left: 4vw; z-index: 110; transition: opacity 0.5s ease; }
.orb-menu-nav .top-btn { color: rgba(255,255,255,0.6); }
.orb-menu-nav .top-btn:hover { color: #fff; }

.orb-container { position: relative; width: 100vw; height: 100vh; perspective: 1000px; }

.orb-wrapper {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transform: translate(calc(-50% + var(--px, 0px)), calc(-50% + var(--py, 0px)));
  transition: left 1.2s cubic-bezier(0.16, 1, 0.3, 1), top 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
}

.ow-1 { left: 25vw; top: 45vh; z-index: 3; }
.ow-2 { left: 50vw; top: 55vh; z-index: 2; }
.ow-3 { left: 75vw; top: 35vh; z-index: 1; }

.orb {
  position: relative;
  width: var(--orb-size, clamp(140px, 16vw, 240px));
  height: var(--orb-size, clamp(140px, 16vw, 240px));
  border-radius: 50%; cursor: pointer;
  transition: width 1.5s cubic-bezier(0.25, 1, 0.3, 1), height 1.5s cubic-bezier(0.25, 1, 0.3, 1), transform 0.8s cubic-bezier(0.25, 1, 0.3, 1);
}
.orb::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: inset -15px -20px 40px rgba(0,0,0,0.6), inset 10px 10px 30px rgba(255,255,255,0.15);
  pointer-events: none; transition: opacity 0.8s ease;
}

/* Gradients purposefully matched to root background themes so expansion is seamless */
.orb-1 { background: radial-gradient(circle at 50% 50%, #222 0%, #000 60%, #000 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 50px rgba(255,255,255,0.08); }
.orb-2 { background: radial-gradient(circle at 50% 50%, #fff 0%, #f5f5f0 60%, #f5f5f0 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 50px rgba(0,0,0,0.15); }
.orb-3 { background: radial-gradient(circle at 50% 50%, #411 0%, #0a0000 60%, #0a0000 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 60px rgba(200,30,30,0.3); }

.orb-wrapper:hover .orb { transform: scale(1.08); }

/* Orb Selection States */
.orb-wrapper.selected {
  left: 50vw !important; top: 50vh !important; z-index: 500;
  --px: 0px !important; --py: 0px !important;
}
.orb-wrapper.selected .orb {
  --orb-size: 200vmax; /* Expands dimensions natively, avoiding pixelation */
  transform: scale(1) !important;
}
.orb-wrapper.selected .orb::after { opacity: 0; }
.orb-wrapper.fade-out { opacity: 0 !important; pointer-events: none; }

.orb-label {
  position: absolute; top: 120%;
  text-align: center; color: rgba(255,255,255,0.7);
  font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase;
  transition: opacity 0.5s ease; text-shadow: 0 4px 15px rgba(0,0,0,0.8);
  pointer-events: none; white-space: nowrap;
}
.orb-wrapper:hover .orb-label { color: #fff; }

.orb-title { font-size: 1.1rem; font-style: italic; text-transform: none; letter-spacing: 0.05em; margin-top: 1vh; opacity: 0.5; transition: opacity 0.5s; }
.orb-wrapper:hover .orb-title { opacity: 0.9; }

/* Responsive adjustments */
@media(max-width: 768px) {
  .ow-1 { left: 50vw; top: 20vh; }
  .ow-2 { left: 50vw; top: 50vh; }
  .ow-3 { left: 50vw; top: 80vh; }
}

/* --- Old Entries Overlay --- */
.overlay { position: fixed; inset: 0; z-index: 150; display: none; flex-direction: column; padding: 10vh 10vw; overflow-y: auto; background: inherit; }
.overlay.show { display: flex; animation: sel-in 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
.overlay.hide { animation: sel-out 0.4s ease forwards; }

@keyframes sel-in { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes sel-out { to { opacity: 0; transform: translateY(-10px); } }

.sel-back { font-family: inherit; font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mut); cursor: pointer; opacity: 0.5; margin-bottom: 6vh; transition: opacity 0.3s; background: none; border: 0; align-self: flex-start; }
.sel-back:hover { opacity: 1; color: var(--fg); }
.sel-title { font-size: clamp(1.4rem, 2.5vw, 2.2rem); letter-spacing: 0.05em; margin-bottom: 0.5vh; color: var(--fg); }
.sel-sub { font-size: 0.75rem; color: var(--dim); font-style: italic; margin-bottom: 6vh; }
.sel-entry { display: flex; align-items: center; justify-content: space-between; padding: 3vh 0; border-bottom: 1px solid var(--bar); cursor: pointer; opacity: 0.6; transition: padding-left 0.4s ease, opacity 0.3s, border-color 0.3s; }
.sel-entry:hover { padding-left: 2vw; opacity: 1; }
.sel-entry.current { opacity: 1; }
.sel-entry.current .sel-e-num { opacity: 1; }
.sel-entry.current .sel-e-dot { opacity: 0.9; transform: scale(1.2); }
.sel-e-num { font-size: 0.6rem; letter-spacing: 0.3em; width: 4vw; flex-shrink: 0; color: var(--mut); opacity: 0.5; transition: opacity 0.3s; }
.sel-e-name { flex: 1; font-size: clamp(1rem, 1.4vw, 1.2rem); color: var(--fg); }
.sel-e-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); opacity: 0.2; transition: opacity 0.3s, transform 0.3s; }

/* --- Stage & Text Entries --- */
#stage { position: absolute; inset: 0; z-index: 10; transition: opacity 0.8s ease; }
.entry { position: absolute; inset: 0; display: none; flex-direction: column; align-items: flex-start; justify-content: center; padding: 10vh 16vw; }
.entry.active { display: flex; }
.lbl { font-size: 0.7rem; letter-spacing: 0.42em; text-transform: uppercase; margin-bottom: 5vh; color: var(--mut); transition: color 1s; }
.block { opacity: 0; transform: translateY(8px); transition: opacity 1.2s ease, transform 1.2s ease, color 1s; max-width: 52ch; }
.block.in { opacity: 1; transform: translateY(0); }
.w { margin-bottom: 3.5vh; color: var(--fg); }
.g { font-style: italic; margin-bottom: 2.5vh; color: var(--dim); }
.r { margin-top: 2vh; color: var(--red); }

/* --- Illustrations --- */
.illus { opacity: 0; transition: opacity 1.5s ease; margin-top: 5vh; color: var(--fg); }
.illus.in { opacity: 0.85; }
.illus path, .illus circle, .illus line, .illus ellipse { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; transition: stroke-dashoffset 3.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.illus.in path, .illus.in circle, .illus.in line, .illus.in ellipse { stroke-dashoffset: 0; }
#flower-svg { width: clamp(60px, 8vw, 100px); }
#shoes-svg { width: clamp(100px, 13vw, 155px); }

/* --- Footer Elements --- */
#prompt { position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%); font-size: 0.65rem; letter-spacing: 0.32em; text-transform: uppercase; z-index: 20; pointer-events: none; transition: opacity 0.8s ease, color 1s; white-space: nowrap; color: var(--mut); }
#prompt.hidden { opacity: 0; }
#counter { position: absolute; bottom: 5vh; right: 8vw; font-size: 0.6rem; letter-spacing: 0.25em; z-index: 20; pointer-events: none; color: var(--ctr); transition: color 1s, opacity 0.8s ease; }

/* --- Full Entry Reveal Panel --- */
.entry-full {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 10vh 16vw 14vh;
  transform: translateY(100%);
  transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
  opacity: 0;
  pointer-events: none;
  overflow-y: auto;
  z-index: 5;
  /* Frosted layer — inherits bg color */
  background: inherit;
}
.entry-full::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--bar);
  opacity: 0.6;
}
.entry.active .entry-full.revealed {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
/* Excerpt drifts up slightly as full panel rises */
.entry.active.excerpt-dimmed > .lbl,
.entry.active.excerpt-dimmed > .block,
.entry.active.excerpt-dimmed > .illus {
  transform: translateY(-18px) !important;
  opacity: 0 !important;
  transition: opacity 0.55s ease, transform 0.75s cubic-bezier(0.16,1,0.3,1) !important;
}

.full-label {
  font-size: 0.62rem; letter-spacing: 0.38em; text-transform: uppercase;
  color: var(--mut); margin-bottom: 4vh; opacity: 0.7;
}
.full-date {
  font-size: 0.6rem; letter-spacing: 0.2em; color: var(--dim); margin-bottom: 5vh;
  font-style: italic; opacity: 0.6;
}
.full-para {
  max-width: 58ch; margin-bottom: 3vh;
  color: var(--fg); line-height: 1.95; font-size: clamp(0.95rem, 1.35vw, 1.1rem);
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.full-para.italic { font-style: italic; color: var(--dim); }
.full-para.accent { color: var(--red); margin-top: 1vh; }
.full-para.in { opacity: 1; transform: translateY(0); }

/* Scroll hint in the prompt when on excerpt layer */
.prompt-scroll { display: inline; }
.prompt-advance { display: inline; }
.in-full-view #prompt .prompt-scroll { display: none; }
.in-full-view #prompt .prompt-advance { display: inline; }

/* Collapse button inside full panel */
.full-collapse {
  position: absolute; top: 3.5vh; right: 4vw;
  font-family: inherit; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--mut); opacity: 0.4; cursor: pointer; background: none; border: 0; outline: none;
  transition: opacity 0.3s, color 0.3s;
}
.full-collapse:hover { opacity: 0.9; color: var(--fg); }

/* Scroll progress pip row */
.full-scroll-hint {
  position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
  font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mut);
  opacity: 0.35; white-space: nowrap; pointer-events: none;
}

@media(max-width: 768px) { .entry-full { padding: 8vh 8vw 14vh; } }

@media(max-width: 768px) { .entry { padding: 8vh 8vw; } .sel-e-num { width: 10vw; } }
</style>
</head>
<body>

<canvas id="gol"></canvas>
<canvas id="grain"></canvas>

<!-- Main Stage Elements -->
<div id="bh"></div>
<div id="curtain"></div>
<div id="prompt"><span class="prompt-scroll">scroll to read · </span><span class="prompt-advance">space · click to continue</span></div>
<div id="counter"></div>
<div id="stage"></div>

<div id="topbar">
  <button class="top-btn" id="vol-btn" onclick="openVolumes()">Volumes</button>
  <div id="vol-tag"></div>
  <button class="top-btn" id="entries-btn" onclick="openSelector()">Entries</button>
</div>

<!-- 3D Parallax Volumes Menu -->
<div id="orb-menu">
  <div class="orb-menu-nav">
    <button class="top-btn menu-back" onclick="closeVolumes()">← Resume</button>
  </div>
  <div class="orb-container">
    <div class="orb-wrapper ow-1" onclick="selectVolume(1)">
      <div class="orb orb-1" id="orb-1"></div>
      <div class="orb-label">Vol. 1<div class="orb-title">The Eesha Arc</div></div>
    </div>
    <div class="orb-wrapper ow-2" onclick="selectVolume(2)">
      <div class="orb orb-2" id="orb-2"></div>
      <div class="orb-label">Vol. 2<div class="orb-title">The Aftermath</div></div>
    </div>
    <div class="orb-wrapper ow-3" onclick="selectVolume(3)">
      <div class="orb orb-3" id="orb-3"></div>
      <div class="orb-label">Vol. 3<div class="orb-title">The Reckoning</div></div>
    </div>
  </div>
</div>

<!-- Entries Selector Overlay (Unchanged) -->
<div id="sel-overlay" class="overlay">
  <button class="sel-back" onclick="closeOverlay('sel-overlay')">← Back</button>
  <div class="sel-title" id="sel-title"></div>
  <div class="sel-sub" id="sel-sub"></div>
  <div id="sel-list"></div>
</div>

<script>
(function(){
  'use strict';

  /* ── Content Definitions ─────────────────────────────────────────────── */
  const VOL_INFO = {
    1: { name: 'The Eesha Arc',  sub: 'September — November', theme: 'sch-dark' },
    2: { name: 'The Aftermath',  sub: 'December — January',   theme: 'sch-inv' },
    3: { name: 'The Reckoning',  sub: 'February',             theme: 'sch-red' }
  };

  const VOL = {
    1: [
      { label:'01 — September', bh:'none', illus:null, blocks:[
        { cls:'w', t:'I had been rehearsing the line all day. Staring at it in my notes app. Considering every possible scenario.' },
        { cls:'w', t:'"I love your shoes," I said. Casually.' }
      ], full:[
        { cls:'', t:"It was the kind of September afternoon where the light comes in sideways and makes ordinary things look important. She was sitting two rows ahead in the courtyard, wearing white canvas sneakers with hand-drawn stars on the toe box. I had been watching her draw them during the last period." },
        { cls:'', t:"I'd written the line in my notes at 9:17 AM. I edited it twice. Once to remove 'actually' from the front, once to reconsider the word 'love' — was it too much? Not enough? Does anyone think about shoes that much? She might." },
        { cls:'', t:"She looked up when I said it. Not the way people look up when they're surprised — the way they look up when they've been waiting for something to start. She said, \"You're the third person today.\" Then, after a beat: \"But you're the first one who looked like he meant it.\"" },
        { cls:'italic', t:"I didn't know yet that I was already in it. You never do, at the beginning." }
      ], audio:{ pitch:80, tension:0.05, noiseAmt:0.08, color:400 } },
      { label:'02 — The Grass', bh:'none', illus:null, blocks:[
        { cls:'w', t:'She started texting me while sitting right in front of me.' },
        { cls:'w', t:'Then she came over and sat beside me. We shared playlists. It was kind of cute.' }
      ], full:[
        { cls:'', t:"We were all sitting in a loose circle on the campus grass, one of those group things where nobody is quite a group yet. I was on my phone. She was directly across from me, maybe four metres away, definitely not looking at me." },
        { cls:'', t:"My phone buzzed. Unknown number. The text said: \"what are you listening to?\"" },
        { cls:'', t:"I looked up. She still wasn't looking at me. I texted back: \"how did you get this number.\" She texted: \"you gave it to me last week don't you remember\" — I didn't. Or maybe I did and forgot. Either way, it felt like a joke we were both in on." },
        { cls:'', t:"Ten minutes later she got up, walked around the entire circle, and sat down next to me like it was the most natural thing. She put one earbud in my ear without asking. I still don't know what she was thinking. I hope it was something obvious." }
      ], audio:{ pitch:90, tension:0.08, noiseAmt:0.06, color:350 } },
      { label:'03 — The Concert', bh:'none', illus:null, blocks:[
        { cls:'g', t:"Travis Scott's beats filled the air." },
        { cls:'g', t:'We sang. Not just the words — the spaces between them.' },
        { cls:'g', t:'We fell asleep connected.' },
        { cls:'g', t:'Somewhere across the city. Still together.' }
      ], full:[
        { cls:'', t:"She'd been to the concert physically. I'd been listening at home, the same show, the same set, pirated livestream on a cracked laptop. We were texting the whole time. I'd say \"this drop\" and she'd say \"I KNOW\" before the drop even hit, because she was there two seconds ahead of me." },
        { cls:'', t:"At some point after midnight we stopped talking about the music and just stayed on the line. She was in a cab going home. I was in bed. The call was still open — not because we had things to say, but because we both wanted the other person to be the last sound we heard." },
        { cls:'italic', t:"\"Still there?\" she texted at 1:46 AM." },
        { cls:'italic', t:"\"Still here,\" I sent back." },
        { cls:'', t:"I don't know which of us fell asleep first. When I woke up at 5 AM the call was still connected, six hours of breathing and city noise and whatever dreams sound like over a phone speaker. I stayed still for a while, just listening. Then I quietly hung up." }
      ], audio:{ pitch:110, tension:0.12, noiseAmt:0.07, color:300 } },
      { label:'04 — The Bouquet', bh:'sz-1', illus:'flower', blocks:[
        { cls:'w', t:'The satisfaction of seeing her smile when I handed her the bouquet was enough of a reward.' }
      ], full:[
        { cls:'', t:"It was her birthday and I'd spent three days deciding whether the gesture was too much. I went to three different florists. The first one had roses — too obvious. The second one had dahlias — too formal. The third one had white ranunculus and small dried things I didn't know the names of, and the woman behind the counter said they were for people who knew what they wanted without knowing why." },
        { cls:'', t:"I wrapped them myself with brown paper and a piece of twine I found in a drawer. The bow was bad. I retied it four times. I left it bad." },
        { cls:'', t:"She opened the door and I held them out and said something stupid like \"for the occasion\" and she looked at the flowers for a long time before she looked at me. Then she smiled — not the smile she gives people at parties. The other one. The smaller one." },
        { cls:'italic', t:"I thought about that smile for weeks. I still think about it." },
        { cls:'accent', t:"That was the moment I should have said something. I didn't. I told myself there was time." }
      ], audio:{ pitch:130, tension:0.25, noiseAmt:0.10, color:280 } },
      { label:'05 — November 22', bh:'sz-2', illus:null, blocks:[
        { cls:'w', t:'She had a long list of questions.' },
        { cls:'w', t:'I answered every question except one.' },
        { cls:'g', t:'"What do you want us to be now?"' },
        { cls:'w', t:"I teared up. I didn't have an answer." },

  /* ── Orb Parallax Physics ──────────────────────────────────────── */
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  let targetMouseX = mouseX, targetMouseY = mouseY;
  let physicsId;
  let physicsTime = 0;

  document.addEventListener('mousemove', e => { targetMouseX = e.clientX; targetMouseY = e.clientY; });
  document.addEventListener('touchmove', e => { targetMouseX = e.touches[0].clientX; targetMouseY = e.touches[0].clientY; });

  function runPhysics() {
    if (!isMenuOpen || isOrbSelecting) return;
    physicsTime += 0.016;
    
    // Smooth trailing lerp for "heavy" feel
    mouseX += (targetMouseX - mouseX) * 0.04;
    mouseY += (targetMouseY - mouseY) * 0.04;

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const orbs = document.querySelectorAll('.orb-wrapper');
    
    orbs.forEach((ow, i) => {
      // If expanding to center, skip physics for that orb
      if (ow.classList.contains('selected')) return;

      const depth = 1 + (i * 0.6); // Further orbs move more
      const dx = (mouseX - cx) * -0.04 * depth;
      const dy = (mouseY - cy) * -0.04 * depth;
      const floatY = Math.sin(physicsTime * 1.5 + i * 2) * 12;
      const floatX = Math.cos(physicsTime * 1.2 + i * 2) * 8;
      
      ow.style.setProperty('--px', `${dx + floatX}px`);
      ow.style.setProperty('--py', `${dy + floatY}px`);
    });

    physicsId = requestAnimationFrame(runPhysics);
  }

  /* ── Volumes 3D Menu Handlers ──────────────────────────────────── */
  window.openVolumes = function() {
    if (audioOn) AudioEngine.silence(); // Explicitly silence on open
    isMenuOpen = true;
    document.body.classList.add('in-menu');
    orbMenu.classList.add('active');
    document.querySelector('.orb-menu-nav').style.opacity = '1';
    
    // Reset orbs from any previous selections
    document.querySelectorAll('.orb-wrapper').forEach(ow => {
      ow.classList.remove('selected', 'fade-out');
      ow.querySelector('.orb-label').style.opacity = 1;
    });
    
    runPhysics();
  };

  window.closeVolumes = function() {
    isMenuOpen = false;
    cancelAnimationFrame(physicsId);
    document.body.classList.remove('in-menu');
    orbMenu.classList.remove('active');
    // Restore audio only if we were already playing (not on first boot)
    if (audioOn && entries && entries[current] && entries[current].audio) {
      AudioEngine.apply(entries[current].audio);
    }
  };

  window.selectVolume = function(key) {
    if (!isMenuOpen || isOrbSelecting) return;
    isOrbSelecting = true;
    hasStarted = true;
    
    const selectedWrapper = document.querySelector(`.ow-${key}`);
    const nav = document.querySelector('.orb-menu-nav');
    nav.style.opacity = '0';
    nav.style.pointerEvents = 'none';

    // Fade out unselected elements
    document.querySelectorAll('.orb-wrapper').forEach(ow => {
      ow.querySelector('.orb-label').style.opacity = 0;
      if (ow !== selectedWrapper) ow.classList.add('fade-out');
    });

    // Expand the selected orb infinitely using CSS width/height native expansion
    selectedWrapper.classList.add('selected');

    // Wait for the orb to fully swallow the viewport
    setTimeout(() => {
      // First interaction — start audio now (orb click counts as user gesture)
      if (!audioOn) {
        audioOn = true;
        AudioEngine.init();
      }
      loadVolume(key, 0);

      // Smoothly fade out the expanded menu to reveal the exact same color underneath it
      orbMenu.style.transition = 'opacity 1s ease';
      orbMenu.classList.remove('active');
      document.body.classList.remove('in-menu');

      // Cleanup logic behind the scenes after the fade is complete
      setTimeout(() => {
        selectedWrapper.classList.remove('selected');
        orbMenu.style.transition = '';
        isOrbSelecting = false;
        isMenuOpen = false;
        cancelAnimationFrame(physicsId);
      }, 1200);
      
    }, 1500);
  };

  /* ── Initialization & Content Logic ────────────────────────────── */
  function loadVolume(key, startIdx = 0) {
    isTransitioning = false;
    volKey = key;
    entries = VOL[volKey];
    TOTAL = entries.length;
    current = startIdx;

    document.body.className = VOL_INFO[volKey].theme;
    if(window.__gol) window.__gol.updateColor();

    stageEl.innerHTML = '';
    entries.forEach((entry, i) => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.id = 'e' + i;
      const lbl = document.createElement('p');
      lbl.className = 'lbl block';
      lbl.textContent = entry.label;
      div.appendChild(lbl);
      
      entry.blocks.forEach(b => {
        const p = document.createElement('p');
        p.className = `${b.cls} block`;
        p.textContent = b.t;
        div.appendChild(p);
      });
      if (entry.illus) div.insertAdjacentHTML('beforeend', illustHTML[entry.illus]);

      // --- Full Entry Panel ---
      if (entry.full && entry.full.length) {
        const fullPanel = document.createElement('div');
        fullPanel.className = 'entry-full';
        fullPanel.innerHTML = `<button class="full-collapse" onclick="collapseFullPanel(event)">↑ close</button>
          <p class="full-label">${entry.label}</p>`;
        entry.full.forEach(para => {
          const p = document.createElement('p');
          p.className = 'full-para' + (para.cls ? ' ' + para.cls : '');
          p.textContent = para.t;
          fullPanel.appendChild(p);
        });
        fullPanel.insertAdjacentHTML('beforeend', '<p class="full-scroll-hint">scroll · click to continue</p>');
        div.appendChild(fullPanel);
      }

      stageEl.appendChild(div);
    });

    document.getElementById('curtain').classList.remove('up');
    enterEntry(current, true);
  }

  /* ── Full Panel: Collapse ────────────────────────────────────────── */
  window.collapseFullPanel = function(e) {
    e.stopPropagation();
    const activeEntry = document.getElementById('e' + current);
    if (!activeEntry) return;
    const fullPanel = activeEntry.querySelector('.entry-full');
    if (fullPanel) {
      fullPanel.classList.remove('revealed');
      activeEntry.classList.remove('excerpt-dimmed');
      document.body.classList.remove('in-full-view');
      if (audioOn) AudioEngine.unduck();
      // Re-fade in excerpt blocks
      activeEntry.querySelectorAll('.block, .illus').forEach(el => {
        el.style.opacity = '';
        el.style.transform = '';
      });
    }
  };

  /* ── Full Panel: Reveal / Dismiss on scroll & touch ─────────────── */
  let fullViewOpen = false;
  let scrollCooldown = false;
  let touchStartY = 0;

  function openFullPanel() {
    const activeEntry = document.getElementById('e' + current);
    if (!activeEntry) return;
    const fullPanel = activeEntry.querySelector('.entry-full');
    if (!fullPanel || fullPanel.classList.contains('revealed')) return;

    fullPanel.classList.add('revealed');
    activeEntry.classList.add('excerpt-dimmed');
    document.body.classList.add('in-full-view');
    fullViewOpen = true;
    if (audioOn) AudioEngine.duck();

    // Stagger the full-para elements in
    const paras = fullPanel.querySelectorAll('.full-para');
    paras.forEach((p, i) => {
      setTimeout(() => p.classList.add('in'), 180 + i * 160);
    });
  }

  function closeFullPanel() {
    const activeEntry = document.getElementById('e' + current);
    if (!activeEntry) return;
    const fullPanel = activeEntry.querySelector('.entry-full');
    if (!fullPanel) return;
    fullPanel.classList.remove('revealed');
    activeEntry.classList.remove('excerpt-dimmed');
    document.body.classList.remove('in-full-view');
    fullViewOpen = false;
    if (audioOn) AudioEngine.unduck();
    activeEntry.querySelectorAll('.block, .illus').forEach(el => {
      el.style.opacity = '';
      el.style.transform = '';
    });
  }

  function handleScrollIntent(direction) {
    if (scrollCooldown || isTransitioning || isMenuOpen || isOrbSelecting) return;

    scrollCooldown = true;
    setTimeout(() => { scrollCooldown = false; }, 600);

    const entry = entries[current];
    const hasFullContent = entry && entry.full && entry.full.length;

    if (direction === 'down') {
      if (hasFullContent && !fullViewOpen) {
        openFullPanel();
      } else {
        if (fullViewOpen) { closeFullPanel(); setTimeout(() => advance(), 350); }
        else advance();
      }
    } else if (direction === 'up') {
      if (fullViewOpen) closeFullPanel();
    } else if (direction === 'advance') {
      // From bottom of full panel
      closeFullPanel();
      setTimeout(() => advance(), 350);
    }
  }

  // Wheel
  let wheelAccum = 0;
  document.addEventListener('wheel', e => {
    if (isMenuOpen || isOrbSelecting) return;
    if (e.target.closest('.overlay') || e.target.closest('#orb-menu')) return;
    // If full panel is open and scrollable, let it scroll naturally
    const activeEntry = document.getElementById('e' + current);
    if (activeEntry) {
      const fullPanel = activeEntry.querySelector('.entry-full.revealed');
      if (fullPanel) {
        const atBottom = fullPanel.scrollTop + fullPanel.clientHeight >= fullPanel.scrollHeight - 4;
        const atTop = fullPanel.scrollTop <= 0;
        if (e.deltaY > 0 && !atBottom) return; // let panel scroll
        if (e.deltaY < 0 && !atTop) return;
        if (e.deltaY < 0 && atTop) { e.preventDefault(); handleScrollIntent('up'); return; }
        if (e.deltaY > 0 && atBottom) { e.preventDefault(); handleScrollIntent('advance'); return; }
      }
    }
    wheelAccum += e.deltaY;
    if (Math.abs(wheelAccum) > 60) {
      handleScrollIntent(wheelAccum > 0 ? 'down' : 'up');
      wheelAccum = 0;
    }
  }, { passive: false });

  // Touch swipe
  document.addEventListener('touchstart', e => {
    if (isMenuOpen || isOrbSelecting) return;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (isMenuOpen || isOrbSelecting) return;
    if (e.target.closest('.overlay') || e.target.closest('#orb-menu')) return;
    const dy = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy) < 40) return; // too small — treat as tap
    handleScrollIntent(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  /* ── Audio Engine (Web Audio API) ─────────────────────────────── */
  const AudioEngine = (function() {
    let ctx = null, master = null, duckGain = null, init = false;
    let droneOsc = [], droneGain = [], noiseNode = null;
    let breathLFO = null, vibratoLFO = null, vibratoGain = null;

    function initialize() {
      if (init) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();

        // Signal chain: oscillators -> droneGain -> duckGain -> master -> destination
        master   = ctx.createGain(); master.gain.value   = 0;   master.connect(ctx.destination);
        duckGain = ctx.createGain(); duckGain.gain.value = 1.0; duckGain.connect(master);

        // Breath LFO: slow volume swell (~14s cycle, ±18% of duckGain)
        // Modulates duckGain so the swell is relative to current level
        breathLFO = ctx.createOscillator();
        breathLFO.type = 'sine';
        breathLFO.frequency.value = 0.072; // ~14s cycle
        const breathDepth = ctx.createGain();
        breathDepth.gain.value = 0.18; // ±18% — clearly audible
        breathLFO.connect(breathDepth);
        breathDepth.connect(duckGain.gain); // modulate duck layer, not master
        breathLFO.start();

        // Vibrato LFO: very slow pitch drift (~8s cycle)
        vibratoLFO  = ctx.createOscillator();
        vibratoLFO.type = 'sine';
        vibratoLFO.frequency.value = 0.12;
        vibratoGain = ctx.createGain();
        vibratoGain.gain.value = 0;
        vibratoLFO.connect(vibratoGain);
        vibratoLFO.start();

        // Three drone oscillators
        const ratios  = [1, 1.498, 2.0];
        const detunes = [1, 1.003, 0.997];
        for (let i = 0; i < 3; i++) {
          let osc = ctx.createOscillator(), g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 80 * ratios[i] * detunes[i];
          g.gain.value = 0;
          vibratoGain.connect(osc.frequency);
          osc.connect(g); g.connect(duckGain);
          osc.start();
          droneOsc.push(osc); droneGain.push(g);
        }
        droneGain[0].gain.value = 1; droneGain[1].gain.value = 0.6; droneGain[2].gain.value = 0.4;

        // Noise layer
        let buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
        let d = buf.getChannelData(0);
        for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * 0.3;
        noiseNode = ctx.createBufferSource(); noiseNode.buffer = buf; noiseNode.loop = true;
        let nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 400; nf.Q.value = 0.5;
        let ng = ctx.createGain(); ng.gain.value = 0;
        noiseNode.connect(nf); nf.connect(ng); ng.connect(duckGain); noiseNode.start();
        noiseNode._gain = ng; noiseNode._filter = nf;

        master.gain.setTargetAtTime(baseMasterLevel, ctx.currentTime, 1.0);
        init = true;
      } catch(e) { console.warn("Web Audio API not supported"); }
    }

    function applyState(cfg) {
      if (!init || !ctx) return;
      if (ctx.state === 'suspended') ctx.resume();

      const now = ctx.currentTime + 0.1, timeConst = 1.5;
      const pitchMult = cfg.pitch * 3.0;
      droneOsc[0].frequency.setTargetAtTime(pitchMult,         now, timeConst);
      droneOsc[1].frequency.setTargetAtTime(pitchMult * 1.498, now, timeConst);
      droneOsc[2].frequency.setTargetAtTime(pitchMult * 2.0,   now, timeConst);
      vibratoGain.gain.setTargetAtTime(pitchMult * 0.004, now, timeConst);

      const dv = 0.4 + cfg.tension * 0.5;
      droneGain[0].gain.setTargetAtTime(dv,        now, timeConst);
      droneGain[1].gain.setTargetAtTime(dv * 0.55, now, timeConst);
      droneGain[2].gain.setTargetAtTime(dv * 0.3,  now, timeConst);
      noiseNode._gain.gain.setTargetAtTime(cfg.noiseAmt, now, timeConst);
      noiseNode._filter.frequency.setTargetAtTime(Math.max(100, cfg.color - cfg.tension * 100), now, timeConst);

      baseMasterLevel = 0.15 + cfg.tension * 0.08;
      master.gain.setTargetAtTime(baseMasterLevel, now, timeConst);
    }

    function duck() {
      if (!init || !ctx || !duckGain) return;
      duckGain.gain.setTargetAtTime(0.55, ctx.currentTime, 0.6);
    }

    function unduck() {
      if (!init || !ctx || !duckGain) return;
      duckGain.gain.setTargetAtTime(1.0, ctx.currentTime, 0.8);
    }

    function silence() {
      if (!init || !ctx || !master) return;
      // Cancel any breath modulation and ramp master to zero cleanly
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 1.0);
    }

    return { init: initialize, apply: applyState, duck, unduck, silence };
  })();

  /* ── Narrative Progression ──────────────────────────────────────── */
  function updateUI() {
    counterEl.textContent = `${current + 1} / ${TOTAL}`;
    volTagEl.textContent = `Vol. ${volKey} — ${VOL_INFO[volKey].name}`;
  }

  function enterEntry(idx, immediate = false) {
    if (idx >= TOTAL) return;
    current = idx;
    const entry = entries[idx];
    const bh = document.getElementById('bh');
    bh.className = entry.bh !== 'none' ? entry.bh : '';

    if (audioOn && entry.audio) AudioEngine.apply(entry.audio);

    if (window.__gol) {
      let gm = 'normal';
      if (idx === TOTAL - 1) gm = 'glider';
      else if (idx === TOTAL - 2) gm = 'dying';
      window.__gol.setMode(gm);
    }

    document.querySelectorAll('.entry').forEach(e => e.classList.remove('active', 'excerpt-dimmed'));
    document.body.classList.remove('in-full-view');
    fullViewOpen = false;
    if (audioOn) AudioEngine.unduck();

    // Reset any open full panels
    document.querySelectorAll('.entry-full').forEach(fp => {
      fp.classList.remove('revealed');
      fp.scrollTop = 0;
      fp.querySelectorAll('.full-para').forEach(p => p.classList.remove('in'));
    });

    const activeEntry = document.getElementById('e' + idx);
    activeEntry.classList.add('active');

    document.querySelectorAll('.block, .illus').forEach(el => {
      el.classList.remove('in');
      el.style.opacity = '';
      el.style.transform = '';
    });
    const blocks = activeEntry.querySelectorAll('.block');
    blocks.forEach((b, i) => { setTimeout(() => { b.classList.add('in'); }, immediate ? i*100 : 200 + i * 380); });

    if (entry.illus) {
      const illusEl = entry.illus === 'flower' ? document.getElementById('flower-svg') : document.getElementById('shoes-svg');
      if (illusEl) setTimeout(() => { illusEl.classList.add('in'); }, immediate ? 500 : 200 + blocks.length * 380 + 300);
    }

    updateUI();
    promptEl.classList.add('hidden');
    const illusDelay = entry.illus ? 1600 : 0;
    setTimeout(() => { promptEl.classList.remove('hidden'); }, immediate ? 1000 : 200 + blocks.length * 380 + illusDelay + 500);
  }

  function advance() {
    if (isTransitioning || isMenuOpen || isOrbSelecting) return;
    const activeEntry = document.getElementById('e' + current);
    if (!activeEntry) return;

    activeEntry.querySelectorAll('.block, .illus').forEach(el => el.classList.remove('in'));
    promptEl.classList.add('hidden');
    
    if (current < TOTAL - 1) {
      isTransitioning = true;
      setTimeout(() => {
        activeEntry.classList.remove('active');
        enterEntry(current + 1);
        isTransitioning = false;
      }, 900);
    } else {
      AudioEngine.silence();
      openVolumes();
    }
  }

  function tryStartAudio() {
    if (!audioOn && entries && entries[current]) {
      audioOn = true; AudioEngine.init();
      if (entries[current].audio) AudioEngine.apply(entries[current].audio);
    }
  }

  document.addEventListener('keydown', e => {
    tryStartAudio();
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
      e.preventDefault();
      if (fullViewOpen) { closeFullPanel(); setTimeout(() => advance(), 350); }
      else advance();
    }
    if (e.key === 'ArrowLeft' || e.key === 'Escape') {
      if (fullViewOpen) closeFullPanel();
    }
  });

  document.addEventListener('click', e => {
    if (e.target.closest('.overlay') || e.target.closest('.top-btn') || e.target.closest('#orb-menu') || e.target.closest('.full-collapse')) return;
    tryStartAudio();
    if (fullViewOpen) { closeFullPanel(); setTimeout(() => advance(), 350); }
    else advance();
  });

  /* ── Background: Film Grain ─────────────────────────────────────── */
  (function(){
    const gc = document.getElementById('grain'), gx = gc.getContext('2d');
    let gW = 0, gH = 0;
    function rz() { gW = gc.width = window.innerWidth; gH = gc.height = window.innerHeight; }
    rz(); window.addEventListener('resize', rz);
    
    function render() {
      if (gW <= 0 || gH <= 0) return;
      const id = gx.createImageData(gW, gH), d = id.data;
      for(let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255 | 0;
        d[i] = d[i+1] = d[i+2] = v; d[i+3] = (Math.random() * 30 + 10) | 0;
      }
      gx.putImageData(id, 0, 0);
    }
    (function loop() { render(); requestAnimationFrame(loop); })();
  })();

  /* ── Background: Game of Life ───────────────────────────────────── */
  (function(){
    const gc = document.getElementById('gol'), gx = gc.getContext('2d');
    const CELL = 6;
    let cols = 0, rows = 0, grid, next, mode = 'normal', dead = false, rstTid = null, golColor = '#fff';

    function fetchColor() { golColor = getComputedStyle(document.body).getPropertyValue('--gol').trim() || '#fff'; }
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      if (w === 0 || h === 0) return;
      gc.width = w; gc.height = h; cols = Math.ceil(w / CELL); rows = Math.ceil(h / CELL);
      grid = Array.from({length: rows}, () => Array.from({length: cols}, () => Math.random() < 0.12 ? 1 : 0));
      next = Array.from({length: rows}, () => new Array(cols).fill(0));
      dead = false; fetchColor();
    }
    function nbr(g, r, c) {
      let n = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
        if (!(dr === 0 && dc === 0)) n += g[(r + dr + rows) % rows][(c + dc + cols) % cols];
      return n;
    }
    function step() {
      if (mode === 'dying' && !dead) {
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) grid[r][c] = 0;
        dead = true; rstTid = setTimeout(() => { mode = 'glider'; resize(); seedGlider(); }, 2200); return;
      }
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const k = nbr(grid, r, c); next[r][c] = (grid[r][c] ? (k === 2 || k === 3) : (k === 3)) ? 1 : 0;
      }
      let t = grid; grid = next; next = t;
    }
    function seedGlider() {
      const cx = Math.floor(cols * 0.25), cy = Math.floor(rows * 0.35);
      [[0,1,0], [0,0,1], [1,1,1]].forEach((row, dr) => { row.forEach((v, dc) => { if (v) grid[(cy + dr) % rows][(cx + dc) % cols] = 1; }); });
    }
    function draw() {
      if (cols === 0 || rows === 0) return;
      gx.clearRect(0, 0, gc.width, gc.height); gx.fillStyle = golColor;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (grid[r][c]) gx.fillRect(c * CELL, r * CELL, CELL - 1, CELL - 1);
    }
    function loop() { step(); draw(); requestAnimationFrame(loop); }

    window.addEventListener('resize', resize);
    window.__gol = { setMode: (m) => { mode = m; if (rstTid) { clearTimeout(rstTid); rstTid = null; } if (m === 'normal') resize(); else if (m === 'dying') dead = false; }, updateColor: fetchColor };
    resize(); loop();
  })();

  /* ── Boot ───────────────────────────────────────────────────────── */
  document.body.className = 'sch-dark in-menu';
  if (window.__gol) window.__gol.updateColor();
  openVolumes();

})();
</script>
</body>
</html>
