
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="gol"></canvas>
<canvas id="grain"></canvas>

<!-- Main Stage Elements -->
<div id="bh"></div>
<div id="curtain"></div>
<div id="prompt"><!-- <span class="prompt-scroll">scroll to read · </span><span class="prompt-advance">space · click to continue</span> --></div>
<div id="counter"></div>
<div id="stage"></div>

<div id="topbar">
  <button class="top-btn" id="vol-btn" onclick="openVolumes()">Volumes</button>
  <div id="vol-tag"></div>
  <button class="top-btn" id="entries-btn" onclick="openSelector()">Entries</button>
</div>

<!-- 3D Parallax Volumes Menu -->
<div id="orb-menu">
  <div class="orb-menu-nav">
    <button class="top-btn menu-back" onclick="closeVolumes()">← Resume</button>
  </div>
  <div class="orb-container">
    <div class="orb-wrapper ow-1" onclick="selectVolume(1)">
      <div class="orb orb-1" id="orb-1"></div>
      <div class="orb-label">2023-2024 <div class="orb-title">Volume I</div></div>
    </div>
    <div class="orb-wrapper ow-2" onclick="selectVolume(2)">
      <div class="orb orb-2" id="orb-2"></div>
      <div class="orb-label">2026 - Present <div class="orb-title">Volume II</div></div>
    </div>
  </div>
</div>

<!-- Entries Selector Overlay (Unchanged) -->
<div id="sel-overlay" class="overlay">
  <button class="sel-back" onclick="closeOverlay('sel-overlay')">← Back</button>
  <div class="sel-title" id="sel-title"></div>
  <div class="sel-sub" id="sel-sub"></div>
  <div id="sel-list"></div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
